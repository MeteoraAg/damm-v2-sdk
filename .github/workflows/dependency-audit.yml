name: Dependency audit

# Runs on every PR, whatever the base branch or the files changed: new advisories are published
# against dependencies that are already in the lockfile
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # advisories of the published dependencies, ignored ones are in pnpm-workspace.yaml
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Audit production dependencies
        run: pnpm audit --prod
